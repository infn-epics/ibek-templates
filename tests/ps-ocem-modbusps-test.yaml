# yaml-language-server: $schema=https://raw.githubusercontent.com/infn-epics/ibek-templates/refs/heads/main/schemas/ioc.schema.json

iocname: "ps-ocem-modbusps-test"
asset: "https://confluence.infn.it/x/test"
devtype: modbusps
template: "ocem"
devgroup: mag
iocprefix: "TEST:MAG:OCEM"
iocroot: "OCEM"
ps:
  current:
    max: 100
  voltage:
    max: 16
# IOC-level defaults for the UNIMAG watchdogs; a device can override each one.
zero_tolerance: 0.4
set_tolerance: 0.8
set_timeout_s: 45
devices:
  - name: "QUATEST01"
    ip: "192.168.1.8"
    set_tolerance: 0.2
    set_timeout_s: 20
  - name: "QUATEST02"
    ip: "192.168.1.9"
