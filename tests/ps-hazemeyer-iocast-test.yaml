# yaml-language-server: $schema=https://raw.githubusercontent.com/infn-epics/ibek-templates/refs/heads/main/schemas/ioc.schema.json

iocname: "ps-hazemeyer-iocast-test"
asset: "https://confluence.infn.it/x/test"
devtype: haz-iocast
template: "hazemeyer"
devgroup: mag
iocprefix: "TEST:MAG:HAZ"
iocroot: "HAZ"
port: 502
# IOC-level defaults for the UNIMAG watchdogs; a device can override each one.
zero_tolerance: 0.4
set_tolerance: 0.8
set_timeout_s: 45
devices:
  - name: "DHTEST01"
    ip: "192.168.1.11"
    set_tolerance: 0.2
    set_timeout_s: 20
  - name: "DHTEST02"
    ip: "192.168.1.12"
