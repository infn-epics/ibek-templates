# yaml-language-server: $schema=https://raw.githubusercontent.com/infn-epics/ibek-templates/refs/heads/main/schemas/ioc.schema.json

iocname: "ps-psEEI-test"
asset: "https://confluence.infn.it/x/test"
devtype: eei
template: "psEEI"
devgroup: mag
iocprefix: "TEST:MAG:EEI"
iocroot: "EEI"
port: 502
ps:
  polarity:
    mode: bipolar-native
  current:
    max: 100
    min: -100
# IOC-level defaults for the UNIMAG sequencer; a device can override each one.
# Omitted altogether, the EEI defaults apply (2 A, 1 A, 30 s).
zero_tolerance: 1.5
set_tolerance: 0.5
set_timeout_s: 45
devices:
  - name: "DHPTEST01"
    ip: "192.168.1.3"
    set_tolerance: 0.2
    set_timeout_s: 20
    ps:
      polarity:
        mode: bipolar-native
      current:
        max: 100
        min: -100
        ramp: 0.2
  - name: "QUATEST01"
    ip: "192.168.1.4"
