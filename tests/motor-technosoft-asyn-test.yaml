# yaml-language-server: $schema=https://raw.githubusercontent.com/infn-epics/ibek-templates/refs/heads/main/schemas/ioc.schema.json

iocname: "tml-ch1"
asset: "https://confluence.infn.it/x/nYD8DQ"
devtype: technosoft-asyn
template: "motor"
devgroup: mot
iocprefix: "SPARC:TML"
iocexit: true
# technosoft-asyn opens server:port (through the Moxa) when server is set, else serial.ptty.
server: scsparcmoxa001.lnf.infn.it
port: 4001
motor:
  hostid: 5
  baudRate: 9600
  velo_max: 50
  accl_max: 100
  jar: 100
  har: 100
  accl: 100
  velo: 20
  jvel: 20
  hvel: 20
# devices: must be at the IOC root, not nested under motor: - the template
# reads top-level `devices`, not `motor.devices` (see motor-schema.yaml
# "Resolution order" note - same class of bug as motor-newport-test.yaml).
# This fixture was the retired tml (motorTML) one; jvel/hvel are not read by
# technosoft-asyn, velo is.
