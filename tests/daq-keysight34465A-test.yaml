# yaml-language-server: $schema=https://raw.githubusercontent.com/infn-epics/ibek-templates/refs/heads/main/schemas/ioc.schema.json

iocname: "daq-keysight34465A-test"
asset: "https://confluence.infn.it/x/test"
devtype: dmm
template: "keysight34465A"
devgroup: diag
iocprefix: "TEST:DIAG:DMM"
iocroot: "DMM"
server: "192.168.190.18"
devices:
  - name: "DMM01"
    boot_state: "STATE_1.sta"
    # Q[pC] = V * C, with C = 1 nF -> factor 1e-9 * 1e12 = 1000
    conversion:
      factor: 1000.0
      offset: 0.0
      egu: "pC"
    iocinit:
      - name: "FUNC"
        value: "DCV"
